<!doctype html><html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const OBJ = P.get('obj') || 'zapatilla';
const SIZE = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(3, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd6f4, 1.2); rim.position.set(-5, 2, -4); scene.add(rim);
const fill = new THREE.DirectionalLight(0xc9d8ff, .6); fill.position.set(-4, -2, 5); scene.add(fill);

const C = { azul: 0x7aa1ff, rosa: 0xf79ee1, crema: 0xede8db, oscuro: 0x2a2a2e, blanco: 0xffffff, azulO: 0x4f74e0, rosaO: 0xe56fc7 };
const mat = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: C[c] ?? c, roughness: .42, metalness: 0, clearcoat: .6, clearcoatRoughness: .3, envMapIntensity: .55, ...o });
const mate = (c) => mat(c, { roughness: .8, clearcoat: .1 });
const mesh = (g, m, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]) => { const x = new THREE.Mesh(g, m); x.position.set(...p); x.rotation.set(...r); x.scale.set(...s); return x; };
const shape = (pts) => { const s = new THREE.Shape(); s.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) { const q = pts[i]; if (q.length === 2) s.lineTo(...q); else s.quadraticCurveTo(q[0], q[1], q[2], q[3]); } return s; };
const extr = (pts, depth, bevel = .2) => { const g = new THREE.ExtrudeGeometry(shape(pts), { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 10, curveSegments: 40 }); g.translate(0, 0, -depth / 2); return g; };
const lathe = (pts, seg = 96) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);
const smooth = (pts, n = 60) => new THREE.SplineCurve(pts.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(n).map(v => [v.x, v.y]);

const g = new THREE.Group();
scene.add(g);

function zapatilla() {
  // suela de dos capas
  g.add(mesh(extr([[0, 0], [3.9, 0], [4.25, .08, 4.3, .45], [4.3, .55], [0, .55], [-.25, .5, -.2, .2], [-.2, .05, 0, 0]], 1.25, .14), mate('crema'), [0, 0, 0]));
  g.add(mesh(extr([[0, .3], [3.95, .3], [4.3, .38, 4.25, .75], [0, .75], [-.25, .7, -.15, .45], [-.12, .32, 0, .3]], 1.3, .16), mat('rosa'), [0, .05, 0]));
  // capellada
  g.add(mesh(extr([[0, .7], [4.05, .7], [4.3, .9, 3.6, 1.2], [2.4, 1.55], [1.5, 2.0], [1.0, 2.15], [.55, 2.2], [.1, 2.2], [-.2, 2.0, -.15, 1.4], [-.15, .9, 0, .7]], 1.1, .28), mat('azul'), [0, 0, 0]));
  // boca
  g.add(mesh(new THREE.SphereGeometry(.5, 48, 24), mate('oscuro'), [.45, 2.5, 0], [0, 0, -.1], [1.0, .2, .95]));
  g.add(mesh(new THREE.TorusGeometry(.5, .13, 16, 64), mat('crema'), [.45, 2.52, 0], [Math.PI / 2, 0, .1], [1.0, .95, 1]));
  // lengüeta
  g.add(mesh(new RoundedBoxGeometry(.45, 1.2, .95, 6, .2), mat('crema'), [1.15, 2.55, 0], [0, 0, -.75]));
  // cordones
  for (let i = 0; i < 4; i++) { const x = 1.55 + i * .4, y = 2.32 - i * .2; g.add(mesh(new THREE.CapsuleGeometry(.08, 1.0, 8, 16), mat('blanco'), [x, y, 0], [Math.PI / 2, 0, 0])); }
  // talón
  g.add(mesh(new RoundedBoxGeometry(.35, .9, .7, 6, .15), mat('rosa'), [-.3, 1.75, 0], [0, 0, .12]));
  // franja lateral
  const curva = new THREE.CatmullRomCurve3([new THREE.Vector3(.6, 1.0, .82), new THREE.Vector3(1.6, 1.15, .84), new THREE.Vector3(2.6, 1.5, .78), new THREE.Vector3(3.2, 1.2, .74)]);
  g.add(mesh(new THREE.TubeGeometry(curva, 64, .11, 16), mat('rosa')));
  g.add(mesh(new THREE.TubeGeometry(curva, 64, .11, 16), mat('rosa'), [0, 0, 0], [0, 0, 0], [1, 1, -1]));
  g.rotation.set(.45, -.7, .05);
}

function casco() {
  const R = 1.5, h = new THREE.Group(); g.add(h);
  const rot = (geo) => { geo.rotateX(Math.PI / 2); return geo; };
  h.add(mesh(new THREE.SphereGeometry(R * .96, 96, 48, 0, Math.PI * 2, 0, Math.PI / 2), mate('oscuro')));
  const nCost = 5, gap = .1, ancho = (Math.PI - gap * (nCost - 1)) / nCost;
  for (let i = 0; i < nCost; i++) {
    const ini = Math.PI + i * (ancho + gap);
    h.add(mesh(rot(new THREE.SphereGeometry(R, 64, 48, ini, ancho, .32, Math.PI - .64)), mat(i % 2 ? 'azul' : 'azul', { side: THREE.DoubleSide })));
  }
  for (const [t0, tl] of [[0, .36], [Math.PI - .36, .36]]) h.add(mesh(rot(new THREE.SphereGeometry(R * 1.005, 64, 16, Math.PI, Math.PI, t0, tl)), mat('rosa', { side: THREE.DoubleSide })));
  h.add(mesh(new THREE.TorusGeometry(R, .12, 24, 120), mat('rosa'), [0, 0, 0], [Math.PI / 2, 0, 0]));
  h.scale.set(1, .92, 1.25);
  g.add(mesh(new RoundedBoxGeometry(1.7, .12, .8, 6, .05), mat('rosa'), [0, .32, 1.95], [-.35, 0, 0]));
  for (const x of [-1.3, 1.3]) {
    const c = new THREE.CatmullRomCurve3([new THREE.Vector3(x, .02, .4), new THREE.Vector3(x * .75, -.8, .5), new THREE.Vector3(x * .25, -1.25, .8)]);
    g.add(mesh(new THREE.TubeGeometry(c, 40, .07, 12), mate('crema')));
  }
  g.add(mesh(new RoundedBoxGeometry(.5, .24, .3, 4, .08), mat('rosa'), [0, -1.28, .85]));
  g.rotation.set(.38, -.75, 0);
}

function patin() {
  g.add(mesh(extr([[0, .6], [2.6, .6], [3.15, .65, 3.1, 1.1], [3.0, 1.35, 2.3, 1.45], [1.3, 1.7], [1.1, 2.9], [.0, 2.9], [-.3, 2.6, -.25, 1.6], [-.25, .7, 0, .6]], 1.15, .3), mat('rosa')));
  g.add(mesh(new RoundedBoxGeometry(1.35, .3, 1.55, 6, .14), mat('crema'), [.55, 3.0, 0]));
  g.add(mesh(new RoundedBoxGeometry(.5, 1.5, .9, 6, .22), mat('crema'), [1.5, 2.25, 0], [0, 0, -.32]));
  for (let i = 0; i < 4; i++) g.add(mesh(new THREE.CapsuleGeometry(.08, 1.05, 8, 16), mat('blanco'), [1.62 + i * .3, 2.5 - i * .33, 0], [Math.PI / 2, 0, 0]));
  g.add(mesh(new RoundedBoxGeometry(3.2, .22, 1.0, 6, .1), mat('oscuro', { roughness: .5 }), [1.45, .3, 0]));
  for (const x of [.35, 2.6]) for (const z of [-.72, .72]) {
    g.add(mesh(new THREE.CylinderGeometry(.42, .42, .42, 48, 1), mat('azul'), [x, -.05, z], [Math.PI / 2, 0, 0]));
    g.add(mesh(new THREE.CylinderGeometry(.18, .18, .46, 32, 1), mat('crema'), [x, -.05, z], [Math.PI / 2, 0, 0]));
  }
  g.add(mesh(new THREE.CylinderGeometry(.26, .3, .4, 32), mat('rosa'), [3.15, .05, 0]));
  g.rotation.set(.3, -.6, 0);
}

function olla() {
  const cuerpo = smooth([[0, 0], [1.3, 0], [1.55, .15], [1.62, .6], [1.62, 1.5], [1.75, 1.62]], 80).concat([[1.75, 1.7], [1.5, 1.7], [1.5, 1.6]]);
  g.add(mesh(lathe(cuerpo), mat('rosa', { side: THREE.DoubleSide })));
  g.add(mesh(new THREE.CylinderGeometry(1.64, 1.64, .28, 96, 1, true), mat('crema', { side: THREE.DoubleSide }), [0, .9, 0]));
  g.add(mesh(new THREE.CircleGeometry(1.5, 64), mate('oscuro'), [0, 1.55, 0], [-Math.PI / 2, 0, 0]));
  const tapa = [[0, -.1], [1.78, -.1]].concat(smooth([[1.8, 0], [1.65, .2], [1.2, .55], [.6, .85], [0, .95]], 60));
  const t = new THREE.Group(); t.position.set(.12, 1.86, 0); t.rotation.set(0, 0, -.1); g.add(t);
  t.add(mesh(lathe(tapa), mat('azulO', { side: THREE.DoubleSide })));
  t.add(mesh(new THREE.TorusGeometry(1.8, .07, 16, 96), mat('crema'), [0, -.06, 0], [Math.PI / 2, 0, 0]));
  t.add(mesh(new THREE.SphereGeometry(.28, 32, 16), mat('crema'), [0, 1.15, 0], [0, 0, 0], [1, .8, 1]));
  t.add(mesh(new THREE.CylinderGeometry(.12, .16, .2, 24), mat('crema'), [0, 1.0, 0]));
  for (const s of [-1, 1]) g.add(mesh(new THREE.TorusGeometry(.32, .12, 16, 40, Math.PI), mat('azul'), [s * 1.72, 1.3, 0], [0, 0, s > 0 ? -Math.PI / 2 : Math.PI / 2]));
  // vapor
  const vapor = mat('blanco', { transparent: true, opacity: .92, roughness: .9, clearcoat: 0 });
  [[-1.05, 2.25, .3, .32], [-1.3, 2.65, .1, .27], [-1.1, 3.05, 0, .22], [-.8, 2.3, .55, .2]].forEach(([x, y, z, r]) => g.add(mesh(new THREE.SphereGeometry(r, 32, 16), vapor, [x, y, z])));
  g.rotation.set(.25, -.4, 0);
}

function botella() {
  const perfil = smooth([[0, 0], [.85, 0], [1.0, .15], [1.02, 1.0], [.86, 1.55], [.86, 1.9], [1.02, 2.4], [1.0, 3.0], [.8, 3.3], [.55, 3.4]], 90).concat([[.5, 3.4], [0, 3.4]]);
  g.add(mesh(lathe(perfil), mat('azul', { transmission: 0, clearcoat: 1 })));
  g.add(mesh(new THREE.CylinderGeometry(1.04, 1.04, .55, 96, 1, true), mat('rosa', { side: THREE.DoubleSide }), [0, 2.55, 0]));
  g.add(mesh(new THREE.CylinderGeometry(.62, .62, .45, 64), mat('crema'), [0, 3.62, 0]));
  g.add(mesh(new THREE.CylinderGeometry(.24, .32, .45, 48), mat('rosa'), [0, 4.05, 0]));
  g.add(mesh(new THREE.TorusGeometry(.3, .07, 16, 48), mat('crema'), [.75, 3.62, 0], [0, 0, 0]));
  for (let i = 0; i < 6; i++) g.add(mesh(new THREE.TorusGeometry(.865, .025, 8, 96), mate('azulO'), [0, 1.6 + i * .06, 0], [Math.PI / 2, 0, 0]));
  g.rotation.set(.12, 0, -.22);
}

function podio() {
  g.add(mesh(lathe(smooth([[0, 0], [2.3, 0], [2.45, .12], [2.45, .55], [2.3, .7]], 40).concat([[0, .7]])), mat('crema')));
  g.add(mesh(lathe(smooth([[0, .7], [1.9, .7], [2.0, .8], [2.0, 1.1], [1.85, 1.2]], 40).concat([[0, 1.2]])), mat('azul')));
  g.add(mesh(new THREE.TorusGeometry(2.46, .08, 16, 120), mat('rosa'), [0, .33, 0], [Math.PI / 2, 0, 0]));
  g.rotation.set(.42, 0, 0);
}

({ zapatilla, casco, patin, olla, botella, podio })[OBJ]();

// encuadre
const box = new THREE.Box3().setFromObject(g);
const centro = box.getCenter(new THREE.Vector3()); g.position.sub(centro);
const sz = box.getSize(new THREE.Vector3()); const tam = Math.max(sz.x, sz.y, sz.z * .7) * 1.12;
const cam = new THREE.PerspectiveCamera(28, 1, .1, 100);
const dist = tam / (2 * Math.tan(THREE.MathUtils.degToRad(14)));
cam.position.set(0, 0, dist); cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
window.LISTO = true;
</script></body></html>
