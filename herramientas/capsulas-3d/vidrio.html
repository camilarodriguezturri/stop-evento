<!doctype html><html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Cápsulas de vidrio rosa (estilo de referencia): dos capas alineadas.
// ?obj=trofeo|botella|zapatilla  &capa=atras|frente
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const P = new URLSearchParams(location.search);
const OBJ = P.get('obj') || 'trofeo', CAPA = P.get('capa') || 'frente';
const SIZE = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE); renderer.setClearColor(0, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

const VERT = `varying vec3 vN; varying vec3 vV;
void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`;
const FRAG = `uniform vec3 base; uniform vec3 rim; uniform float a0; uniform float a1; uniform float spec; uniform float pw;
varying vec3 vN; varying vec3 vV;
void main(){
  vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n;
  float f = pow(1. - abs(dot(n, vV)), pw);
  vec3 L1 = normalize(vec3(-.5,.75,.6)); vec3 L2 = normalize(vec3(.7,.3,.5));
  float s = pow(max(dot(n, normalize(L1+vV)),0.), 70.) + .55*pow(max(dot(n, normalize(L2+vV)),0.), 120.);
  vec3 c = mix(base, rim, f) + s*spec;
  float a = clamp(mix(a0, a1, f) + s*spec, 0., 1.);
  gl_FragColor = vec4(c, a);
}`;
const vidrio = (o) => new THREE.ShaderMaterial({
  vertexShader: VERT, fragmentShader: FRAG, transparent: true, depthWrite: o.depthWrite ?? false, side: o.side ?? THREE.FrontSide,
  uniforms: { base: { value: new THREE.Color(o.base) }, rim: { value: new THREE.Color(o.rim) }, a0: { value: o.a0 }, a1: { value: o.a1 }, spec: { value: o.spec ?? .9 }, pw: { value: o.pw ?? 2.0 } },
});
const FRENTE = { base: 0xfab8ec, rim: 0xd560bd, a0: .07, a1: .9 };
const ATRAS = { base: 0xf2a0e0, rim: 0xc45aae, a0: .5, a1: .9, spec: .25, side: THREE.BackSide };
const SOLIDO = { base: 0xf79ee1, rim: 0xa8429a, a0: 1, a1: 1, spec: .8, depthWrite: true };
const mat = (tipo) => vidrio(tipo);

const g = new THREE.Group(); scene.add(g);
const add = (geo, m, p = [0,0,0], r = [0,0,0], s = [1,1,1]) => { const x = new THREE.Mesh(geo, m); x.position.set(...p); x.rotation.set(...r); x.scale.set(...s); g.add(x); return x; };
const spl = (pts, n = 60) => new THREE.SplineCurve(pts.map(([x,y]) => new THREE.Vector2(x,y))).getPoints(n);
const lathe = (pts, seg = 96) => new THREE.LatheGeometry(pts, seg);
const frente = CAPA === 'frente';

function trofeo() {
  const copa = lathe(spl([[0.05,1.55],[0.4,1.62],[0.85,1.95],[1.18,2.55],[1.33,3.2],[1.38,3.8]]));
  if (frente) {
    add(copa, mat(FRENTE));
    add(new THREE.TorusGeometry(1.38, .045, 16, 120), mat({ ...FRENTE, a0: .7 }), [0, 3.8, 0], [Math.PI/2, 0, 0]);
    add(lathe(spl([[0.36,1.6],[0.2,1.45],[0.13,1.0],[0.18,.55],[0.32,.42]])), mat({ ...FRENTE, a0: .5 }));
    add(lathe(spl([[0.32,.42],[0.8,.32],[1.0,.18],[1.0,0.02],[0.0,0.0]])), mat({ ...FRENTE, a0: .45 }));
    for (const sx of [-1, 1]) { const c = new THREE.CatmullRomCurve3([[1.3,3.55],[1.85,3.6],[2.1,3.2],[1.85,2.55],[1.2,2.3]].map(([x,y]) => new THREE.Vector3(sx*x, y, 0))); add(new THREE.TubeGeometry(c, 60, .1, 20), mat({ ...FRENTE, a0: .45 })); }
  } else {
    add(copa, mat(ATRAS));
  }
  g.rotation.set(.32, 0, -.06);
}


function botella() {
  const cuerpo = lathe(spl([[0.05,0],[0.85,0.02],[1.0,.2],[1.02,1.0],[.9,1.6],[.9,1.9],[1.02,2.4],[1.0,3.05],[.78,3.35],[.52,3.45]], 90));
  if (frente) {
    add(cuerpo, mat(FRENTE));
    for (let i = 0; i < 3; i++) add(new THREE.TorusGeometry(.905, .02, 8, 96), mat({ ...FRENTE, a0: .8 }), [0, 1.66 + i * .1, 0], [Math.PI/2, 0, 0]);
    add(new THREE.CylinderGeometry(.6, .6, .45, 64), mat(SOLIDO), [0, 3.66, 0]);
    add(new THREE.CylinderGeometry(.24, .32, .45, 48), mat({ ...SOLIDO, base: 0x7aa1ff, rim: 0x3e5fc4 }), [0, 4.08, 0]);
    add(new THREE.TorusGeometry(.3, .07, 16, 48), mat(SOLIDO), [.78, 3.66, 0]);
  } else {
    add(cuerpo, mat(ATRAS));
  }
  g.rotation.set(.18, 0, -.18);
}


function zapatilla() {
  // Zapatilla de vidrio transparente (referencia: escultura/tienda de vidrio): costuras marcadas con tubo,
  // cordones de vidrio, suela gruesa con tacos y las tres tiras de adidas con contorno de neón.
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const perfil = (pts) => { const s = new THREE.Shape(); const c = spl(pts, 140); s.moveTo(c[0].x, c[0].y); c.slice(1).forEach((v) => s.lineTo(v.x, v.y)); return s; };
  const ancho = (x) => 1 - .3 * THREE.MathUtils.smoothstep(x, 1.0, 2.3) - .1 * THREE.MathUtils.smoothstep(-x, 1.4, 2.2);
  const afinar = (geo, d) => { geo.translate(0, 0, -d / 2); const p = geo.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, p.getZ(i) * ancho(p.getX(i))); geo.computeVertexNormals(); return geo; };
  const D = 1.0, BT = .26;
  const lado = (x) => (D / 2 + BT) * ancho(x);              // z de la cara lateral que mira a cámara
  const tubo = (pts, r, m, z = 1, n = 80) => add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(([x, y]) => V3(x, y, z * (lado(x) + .01)))), n, r, 12), m);

  const CRISTAL = { base: 0xfde3f6, rim: 0xd560bd, a0: .03, a1: .72, spec: 1.1, pw: 2.4 };
  const BORDE = { base: 0xf7b6e8, rim: 0xb94aa3, a0: .55, a1: .95, spec: 1.2, pw: 1.6 };
  const NEON = { base: 0x9db8ff, rim: 0x4f74e6, a0: 1, a1: 1, spec: 1.3, pw: 1.2, depthWrite: true };

  const capellada = perfil([[-1.86,.5],[-2.06,1.0],[-2.04,1.7],[-1.9,2.12],[-1.62,2.2],[-1.24,1.94],[-.7,1.86],[-.26,2.14],[.06,2.1],[.5,1.76],[1.12,1.36],[1.8,1.06],[2.18,.8],[2.24,.54],[2.04,.46],[0,.46],[-1.86,.5]]);
  const geoC = afinar(new THREE.ExtrudeGeometry(capellada, { depth: D, bevelEnabled: true, bevelThickness: BT, bevelSize: .2, bevelSegments: 12, curveSegments: 80 }), D);

  if (!frente) { add(geoC, mat({ ...ATRAS, a0: .32, a1: .8 })); g.rotation.set(.22, -.42, .04); return; }

  add(geoC, mat(CRISTAL));
  // suela gruesa de vidrio esmerilado + tacos redondeados (como la escultura de la referencia)
  const suela = perfil([[-2.06,.62],[-2.22,.4],[-2.12,.2],[0,.18],[2.2,.2],[2.42,.38],[2.36,.64],[2.12,.6],[0,.56],[-2.06,.62]]);
  const DS = 1.16, geoS = afinar(new THREE.ExtrudeGeometry(suela, { depth: DS, bevelEnabled: true, bevelThickness: .16, bevelSize: .1, bevelSegments: 10, curveSegments: 60 }), DS);
  add(geoS, mat({ ...BORDE, a0: .38, a1: .9, base: 0xfcd0f1 }));
  for (let k = 0; k < 5; k++) {
    const x = -1.7 + k * .92, w = ancho(x);
    for (const z of [-1, 1]) add(new RoundedBoxGeometry(.72, .38, .46, 5, .16), mat({ ...BORDE, a0: .42, a1: .95 }), [x, .14, z * (DS / 2) * w * .74]);
  }
  // solo dos costuras: el borde de la suela y el cuello
  const B = mat(BORDE);
  for (const z of [-1, 1]) {
    tubo([[-1.98,.66],[-1.2,.62],[0,.6],[1.2,.62],[2.1,.66],[2.3,.7]], .045, B, z);
  }
  const cuello = new THREE.CatmullRomCurve3([V3(-1.92, 2.12, 0), V3(-1.66, 2.2, lado(-1.66)), V3(-1.2, 1.96, lado(-1.2) * .9), V3(-.7, 1.9, lado(-.7) * .7), V3(-.4, 2.0, 0), V3(-.7, 1.9, -lado(-.7) * .7), V3(-1.2, 1.96, -lado(-1.2) * .9), V3(-1.66, 2.2, -lado(-1.66))], true);
  add(new THREE.TubeGeometry(cuello, 120, .06, 12, true), B);
  // cordones de vidrio que cruzan por arriba
  for (let k = 0; k < 4; k++) {
    const x = -.12 + k * .3, y = 1.98 - k * .21, w = lado(x) * .62;
    const c = new THREE.CatmullRomCurve3([V3(x - .1, y - .02, -w), V3(x - .02, y + .16, -w * .45), V3(x + .03, y + .2, 0), V3(x + .08, y + .16, w * .45), V3(x + .16, y - .02, w)]);
    add(new THREE.TubeGeometry(c, 40, .055, 12), mat({ ...BORDE, a0: .6, a1: 1 }));
  }
  // las tres tiras: vidrio azul translúcido con contorno de neón
  for (let i = 0; i < 3; i++) {
    const x0 = -.66 + i * .32;
    const q = [[x0, .62], [x0 + .16, .62], [x0 + .8, 1.84], [x0 + .64, 1.86]];
    const sh = new THREE.Shape(); sh.moveTo(...q[0]); q.slice(1).forEach((v) => sh.lineTo(...v)); sh.lineTo(...q[0]);
    add(new THREE.ShapeGeometry(sh), mat({ base: 0x9db8ff, rim: 0x7aa1ff, a0: .5, a1: .5, spec: .4, side: THREE.DoubleSide }), [0, 0, lado(x0 + .4) + .02]);
    const c = new THREE.CatmullRomCurve3([...q, q[0]].map(([x, y]) => V3(x, y, lado(x0 + .4) + .03)), false, 'catmullrom', 0);
    add(new THREE.TubeGeometry(c, 80, .028, 10), mat(NEON));
  }
  g.rotation.set(.22, -.42, .04);
}

({ trofeo, botella, zapatilla })[OBJ]();
// encuadre fijo por objeto: se calcula con la capa de frente siempre, para alinear ambas capas
const ref = new THREE.Group();
const box = new THREE.Box3().setFromObject(g);
const ENC = { trofeo: [0, 2.0, 0, 5.6], botella: [0, 2.05, 0, 5.2], zapatilla: [.1, 1.12, 0, 5.3] }[OBJ];
const cam = new THREE.PerspectiveCamera(26, 1, .1, 100);
const dist = ENC[3] / (2 * Math.tan(THREE.MathUtils.degToRad(13)));
cam.position.set(ENC[0], ENC[1], dist); cam.lookAt(ENC[0], ENC[1], ENC[2]);
renderer.render(scene, cam);
window.LISTO = true;
</script></body></html>
